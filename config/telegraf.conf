[agent]
    interval = "10s"
    flush_interval = "5s"

[[outputs.influxdb]]
    urls = ["http://influxdb:8086"]
    database = "renfe"
    skip_database_creation = false
    username = "root"
    password = "root"

# Posicion de cada tren, publicada por api/trenes.py
[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto:1883"]
    topics = [
    "renfe/trenes"
    ]
    data_format = "json"
    name_override = "trenes"
    tag_keys = ["tren", "linea", "nucleo", "categoria"]
    json_string_fields = ["trip", "estado", "parada_id", "parada"]
    json_time_key = "time"
    json_time_format = "unix_ms"

# Resumen por nucleo (trenes activos, retraso medio, trenes con retraso)
[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto:1883"]
    topics = [
    "renfe/nucleos"
    ]
    data_format = "json"
    name_override = "trenes_nucleo"
    tag_keys = ["nucleo"]

# Contadores globales (trenes_activos, retraso_medio_s, con_retraso)
[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto:1883"]
    topics = [
    "renfe/stats/#"
    ]
    data_format = "value"
    data_type = "float"
    name_override = "trenes_stats"

# Viajes cancelados (trip_updates CANCELED): tren, linea, nucleo, de donde a donde iba y coordenadas del origen (solo LD)
[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto:1883"]
    topics = [
    "renfe/cancelados"
    ]
    data_format = "json"
    name_override = "trenes_cancelados"
    tag_keys = ["tren", "linea", "nucleo", "categoria"]
    json_string_fields = ["trip", "origen", "destino"]
